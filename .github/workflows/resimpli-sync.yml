# REsimpli sync — frequent trigger via GitHub Actions, free tier
#
# Vercel's own Cron (vercel.json) only runs once a day on the Hobby plan, which isn't "live"
# enough for Kyle. This workflow just POSTs to the already-deployed, already-guarded
# /api/resimpli-sync endpoint on a much tighter schedule — it has no REsimpli/Supabase logic
# of its own, and makes no decision about what to write. Every actual write still only happens
# if api/resimpli-sync.mjs's own auth check passes and the Postgres resimpli_sync_apply()
# function's hard self-check (see supabase/resimpli_sync.sql) passes — this workflow cannot
# cause a write that server-side path wouldn't already allow on its own.
#
# Needs exactly one GitHub repo secret: CRON_SECRET, set to the SAME value as the
# CRON_SECRET env var already set on Vercel (Settings → Secrets and variables → Actions →
# New repository secret, name CRON_SECRET). If it isn't set, every run no-ops instead of
# calling the endpoint with an empty/garbage Authorization header.

name: REsimpli sync

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check CRON_SECRET is configured
        id: check
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET repo secret is not set — skipping this run entirely."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Trigger REsimpli sync
        if: steps.check.outputs.skip == 'false'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          http_response=$(curl -sS --max-time 120 -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://kyled.vercel.app/api/resimpli-sync")
          status_code=$(echo "$http_response" | tail -n1)
          body=$(echo "$http_response" | sed '$d')

          echo "HTTP status: $status_code"
          if [ "$status_code" -lt 200 ] || [ "$status_code" -ge 300 ]; then
            echo "::error::resimpli-sync returned a non-2xx status ($status_code) — see the Vercel function logs for details."
            exit 1
          fi

          # Only counts — no addresses, no secrets, no PII. The cron path always applies for
          # real (never dryRun), and the apply response body is just {dryRun, matched, changed,
          # review, syncedAt, pipelineOrderUpdated}; the dry-run-only fields (full records with
          # addresses) never appear in this response shape.
          matched=$(echo "$body" | jq -r '.matched // "n/a"')
          changed=$(echo "$body" | jq -r '.changed // "n/a"')
          review=$(echo "$body" | jq -r '.review // "n/a"')
          echo "matched=$matched changed=$changed review=$review"
