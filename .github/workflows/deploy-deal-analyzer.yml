name: Deploy Deal Analyzer

on:
  push:
    branches: ['claude/charming-sagan-pMuYS']
    paths: ['deal-analyzer/**', '.github/workflows/deploy-deal-analyzer.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/charming-sagan-pMuYS

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        id: deploy
        run: |
          OUTPUT=$(vercel --token ${{ secrets.VERCEL_TOKEN }} --yes --prod --name nexus-deal-analyzer 2>&1)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oE 'https://[^ ]+\.vercel\.app' | grep -v 'inspect' | tail -1)
          echo "url=$URL" >> $GITHUB_OUTPUT
        working-directory: deal-analyzer

      - name: Print deployment URL
        run: echo "Live at ${{ steps.deploy.outputs.url }}"
