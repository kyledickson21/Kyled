name: Deploy to Vercel

on:
  push:
    branches: [property-lookup-app]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: property-lookup-app

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel --token ${{ secrets.VERCEL_TOKEN }} --yes --prod --name nexus-property-lookup 2>&1 | grep -o 'https://[^ ]*\.vercel\.app' | tail -1)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $URL"

      - name: Print URL
        run: echo "App is live at ${{ steps.deploy.outputs.url }}"
