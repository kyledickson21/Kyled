name: Deploy to Vercel

on:
  push:
    branches: [property-lookup-app]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: property-lookup-app

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link or create Vercel project
        run: |
          RESP=$(curl -sf "https://api.vercel.com/v9/projects/nexus-property-lookup" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" || echo "{}")
          PROJECT_ID=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || echo "")
          ORG_ID=$(echo "$RESP"     | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('accountId',''))" 2>/dev/null || echo "")
          if [ -n "$PROJECT_ID" ] && [ -n "$ORG_ID" ]; then
            mkdir -p .vercel
            echo "{\"projectId\":\"$PROJECT_ID\",\"orgId\":\"$ORG_ID\"}" > .vercel/project.json
          fi

      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          OUTPUT=$(vercel --token ${{ secrets.VERCEL_TOKEN }} --yes --prod --name nexus-property-lookup 2>&1)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oE 'https://[^ ]+\.vercel\.app' | grep -v 'inspect' | tail -1)
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Test connectivity and post results to issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FC=$(curl -si \
            "https://property.franklincountyauditor.com/_web/search/CommonSearch.aspx?mode=ADDRESS" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: en-US,en;q=0.9" \
            --max-time 15 2>&1 | head -c 2000)
          DBG=$(curl -s \
            "https://nexus-property-lookup.vercel.app/api/debug?address=1234+E+Broad+St+Columbus+OH" \
            --max-time 25 2>&1 | head -c 3000)
          BODY=$(printf '## Connectivity Test Results\n\n### Franklin County Auditor (direct)\n```\n%s\n```\n\n### Debug Endpoint\n```json\n%s\n```' "$FC" "$DBG")
          curl -s -X POST "https://api.github.com/repos/kyledickson21/Kyled/issues" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg title "Scraper connectivity test $(date -u +%Y%m%d-%H%M%S)" --arg body "$BODY" '{title:$title,body:$body}')"
