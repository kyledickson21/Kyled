name: Test scraper connectivity
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: property-lookup-app
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Franklin County auditor site directly
        run: |
          echo "=== GET Franklin County search form ==="
          curl -si \
            "https://property.franklincountyauditor.com/_web/search/CommonSearch.aspx?mode=ADDRESS" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: en-US,en;q=0.9" \
            --max-time 15 2>&1 | head -c 3000 | tee fc_step1.txt
          echo ""
          echo "=== Hidden input fields found ==="
          grep -oE 'name="[^"]*"[^>]{0,80}value="[^"]{0,60}' fc_step1.txt | head -20 || true

      - name: Test live Vercel debug endpoint
        run: |
          echo "=== Vercel /api/debug endpoint ==="
          curl -s "https://nexus-property-lookup.vercel.app/api/debug?address=1234+E+Broad+St+Columbus+OH" \
            --max-time 25 2>&1 | tee debug_response.json
          echo ""

      - name: Save results to repo
        run: |
          git config user.email "ci@test.com"
          git config user.name "CI Test"
          git add fc_step1.txt debug_response.json
          git diff --cached --quiet || git commit -m "test-results: scraper connectivity $(date -u +%Y%m%d-%H%M%S)"
          git push origin property-lookup-app
